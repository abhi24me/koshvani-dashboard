name: Update Koshvani Data

on:
  schedule:
    # ~10:00 IST and ~18:00 IST (UTC = IST - 5:30)
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # GitHub-hosted runners (ubuntu-latest) run on Azure datacenter IPs, which
    # koshvani.up.nic.in's firewall drops outright - confirmed via extensive
    # testing (raw TCP connect times out before any TLS handshake, from
    # GitHub Actions, Google Cloud, 12 other independent networks worldwide
    # including an India-based one, and multiple residential-proxy services).
    # It's a network-level block, so no client library or fingerprint
    # technique can get past it - only a genuine residential/office
    # connection works, like this self-hosted runner has. See README.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Koshvani data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
