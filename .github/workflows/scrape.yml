name: Update Koshvani Data

on:
  schedule:
    # ~10:00 IST and ~18:00 IST (UTC = IST - 5:30)
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # GitHub-hosted runners (ubuntu-latest) run on Azure datacenter IPs, which
    # koshvani.up.nic.in's firewall drops outright - confirmed via extensive
    # testing (raw TCP connect times out before any TLS handshake, from
    # GitHub Actions, Google Cloud, 12 other independent networks worldwide
    # including an India-based one, and multiple residential-proxy services).
    # It's a network-level block, so no client library or fingerprint
    # technique can get past it - only a genuine residential/office
    # connection works, like this self-hosted runner has. See README.
    runs-on: self-hosted
    steps:
      # Plain git clone/pull instead of actions/checkout@v4 - the latter's
      # own Windows temp-file cleanup step hits a persistent EBUSY
      # (file locked) error on this machine that survived a Defender
      # exclusion and killing stale processes; this sidesteps that code
      # path entirely rather than continuing to chase the root cause.
      - name: Checkout (manual)
        shell: pwsh
        run: |
          $remote = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if (-not (Test-Path "repo\.git")) {
            git clone $remote repo
          }
          cd repo
          git remote set-url origin $remote
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fdx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: repo
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        working-directory: repo
        run: python -m playwright install chromium

      - name: Run scraper
        working-directory: repo
        run: python scraper/scrape.py

      - name: Commit updated data
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Koshvani data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
