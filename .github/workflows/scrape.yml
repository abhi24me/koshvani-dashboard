name: Update Koshvani Data

on:
  schedule:
    # ~10:00 IST and ~18:00 IST (UTC = IST - 5:30)
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    # GitHub-hosted runners (ubuntu-latest) run on Azure datacenter IPs, which
    # koshvani.up.nic.in's firewall blocks outright (connection times out
    # before any HTTP response - confirmed via a diagnostic curl step). A
    # self-hosted runner on a normal residential/office connection reaches it
    # fine, so this job runs on a self-hosted runner instead. See README for
    # setup - it's a small background service, not a full server.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Koshvani data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
