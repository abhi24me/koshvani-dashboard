name: Update Koshvani Data

# Manual trigger only for now - see README "Keeping the dashboard updated"
# for why. A self-hosted runner (needed because koshvani.up.nic.in blocks
# every cloud/datacenter IP tested) is registered on one machine but still
# has unresolved Windows-specific issues (service account permissions,
# antivirus file locks); the schedule is left off so it doesn't fail
# silently twice a day in the meantime. The reliable path today is running
# scraper/scrape.py locally and pushing - see the README.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout (manual)
        run: |
          $remote = "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if (-not (Test-Path "repo\.git")) {
            git clone $remote repo
          }
          cd repo
          git remote set-url origin $remote
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git clean -fdx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: repo
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        working-directory: repo
        run: python -m playwright install chromium

      - name: Run scraper
        working-directory: repo
        run: python scraper/scrape.py

      - name: Commit updated data
        working-directory: repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Koshvani data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main
