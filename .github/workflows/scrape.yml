name: Update Koshvani Data

on:
  schedule:
    # ~10:00 IST and ~18:00 IST (UTC = IST - 5:30)
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Diagnose connectivity to koshvani.up.nic.in
        run: |
          echo "--- DNS ---"
          nslookup koshvani.up.nic.in || true
          echo "--- curl (verbose, 25s timeout) ---"
          curl -v --max-time 25 -o /dev/null https://koshvani.up.nic.in/KoshvaniStatic.aspx || echo "curl exit code: $?"
        continue-on-error: true

      - name: Run scraper
        run: python scraper/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update Koshvani data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
