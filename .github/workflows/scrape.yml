name: Update Koshvani Data

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnostic - test curl-cffi (Chrome JA3 impersonation) direct, no proxy
        run: |
          pip install curl-cffi
          python3 << 'PYEOF'
          from curl_cffi import requests
          import time
          for impersonate in ["chrome", "chrome124", "safari", "safari17_0"]:
              t0 = time.time()
              try:
                  s = requests.Session(impersonate=impersonate)
                  r = s.get("https://koshvani.up.nic.in/KoshvaniStatic.aspx", timeout=30)
                  print(f"{impersonate}: status={r.status_code} time={time.time()-t0:.1f}s size={len(r.content)}")
              except Exception as e:
                  print(f"{impersonate}: FAILED after {time.time()-t0:.1f}s: {type(e).__name__}: {e}")
          PYEOF
        continue-on-error: true

      - name: Run scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: echo "placeholder - will restore after diagnostic"
